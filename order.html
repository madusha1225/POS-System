<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopPoint - Manage Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      overflow-x: hidden; /* Hides any horizontal scroll */
      background-color: #dfeee6;
    }
    .sidebar {
      background-color: #ececec;
      padding: 20px;
      height: 100vh;
      position: fixed;
      width: 15%;
      overflow-x: hidden; /* Ensure no overflow on the sidebar */
    }
    .sidebar a {
      display: block;
      padding: 15px;
      margin-bottom: 10px;
      text-decoration: none;
      color: #333;
      background-color: #d1d8ff;
      border-radius: 5px;
      text-align: center;
    }
    .sidebar a:hover {
      background-color: #c0c7ff;
    }
    .container-fluid {
      width: 80%;
      margin-left: 17%;
      overflow-x: hidden; /* Prevent horizontal scroll in the main container */
    }
    .form-container {
      background-color: #badfbb;
      padding: 20px;
      border-radius: 10px;
    }
    .btn-custom {
      background-color: #3b8039;
      color: white;
    }
    .table th, .table td {
      vertical-align: middle;
    }

    /* Responsiveness for smaller devices */
    @media (max-width: 992px) {
      .container-fluid {
        margin-left: 0;
        width: 100%;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        display: none; /* Hide sidebar on smaller screens */
      }
      .show-sidebar {
        display: block;
      }
    }

    @media (max-width: 576px) {
      .sidebar{
        display: none;
      }
      .content{
        position: absolute;
        left: 0;
        right: 0;
        top: 10vh;
        margin: auto;
      }
    }

    /* Toggle button for sidebar on smaller screens */
    .toggle-btn {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background-color: #3b8039;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
    }

    @media (max-width: 992px) {
      .toggle-btn {
        display: block;
      }
    }

  </style>
</head>
<body>

<button class="toggle-btn" onclick="toggleSidebar()">☰ Menu</button>

<div class="sidebar" id="sidebar">
  <h4>ShopPoint</h4>
  <a href="#">Dashboard</a>
  <a href="#">Customer</a>
  <a href="#">Item</a>
  <a href="#">Orders</a>
</div>

<div class="container-fluid">
  <h2 class="mt-3">Manage Orders</h2>

  <!-- Invoice Details Section -->
  <div class="row form-container mt-3">
    <div class="col-md-6">
      <div class="mb-3">
        <label for="orderId" class="form-label">Order ID</label>
        <input type="text" class="form-control" id="orderId">
      </div>
      <div class="mb-3">
        <label for="orderDate" class="form-label">Date</label>
        <input type="date" class="form-control" id="orderDate">
      </div>
    </div>
    <div class="col-md-6">
      <div class="mb-3">
        <label for="customerId" class="form-label">Customer ID</label>
        <input type="text" class="form-control" id="customerId">
      </div>
      <div class="mb-3">
        <label for="customerName" class="form-label">Customer Name</label>
        <input type="text" class="form-control" id="customerName">
      </div>
    </div>
  </div>

  <!-- Item Details Section -->
  <div class="row form-container mt-3">
    <div class="col-md-4">
      <div class="mb-3">
        <label for="itemId" class="form-label">Item ID</label>
        <input type="text" class="form-control" id="itemId">
      </div>
    </div>
    <div class="col-md-4">
      <div class="mb-3">
        <label for="model" class="form-label">Model</label>
        <input type="text" class="form-control" id="model">
      </div>
    </div>
    <div class="col-md-4">
      <div class="mb-3">
        <label for="onHandQuantity" class="form-label">On Hand Quantity</label>
        <input type="number" class="form-control" id="onHandQuantity">
      </div>
    </div>
    <div class="col-md-6">
      <div class="mb-3">
        <label for="unitPrice" class="form-label">Unit Price</label>
        <input type="number" class="form-control" id="unitPrice">
      </div>
    </div>
    <div class="col-md-6">
      <div class="mb-3">
        <label for="orderQuantity" class="form-label">Order Quantity</label>
        <input type="number" class="form-control" id="orderQuantity">
      </div>
    </div>
    <div class="col-md-12">
      <button class="btn btn-custom">Add</button>
    </div>
  </div>

  <!-- Order Table Section -->
  <div class="row form-container mt-3">
    <div class="col-md-12">
      <table class="table table-bordered text-center">
        <thead>
        <tr>
          <th>Item ID</th>
          <th>Model</th>
          <th>Unit Price</th>
          <th>Quantity</th>
          <th>Total</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <td>101</td>
          <td>Model A</td>
          <td>$50</td>
          <td>2</td>
          <td>$100</td>
        </tr>
        <!-- Add more rows as needed -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Summary and Actions Section -->
  <div class="row form-container mt-3">
    <div class="col-md-6">
      <div class="mb-3">
        <label for="total" class="form-label">Total</label>
        <input type="number" class="form-control" id="total">
      </div>
      <div class="mb-3">
        <label for="discount" class="form-label">Discount</label>
        <input type="number" class="form-control" id="discount">
      </div>
      <div class="mb-3">
        <label for="subTotal" class="form-label">Sub Total</label>
        <input type="number" class="form-control" id="subTotal">
      </div>
      <div class="mb-3">
        <label for="cash" class="form-label">Cash</label>
        <input type="number" class="form-control" id="cash">
      </div>
      <div class="mb-3">
        <label for="balance" class="form-label">Balance</label>
        <input type="number" class="form-control" id="balance">
      </div>
    </div>
    <div class="col-md-6 d-flex flex-column justify-content-around">
      <button class="btn btn-custom mb-3">Place Order</button>
      <button class="btn btn-custom mb-3">New Order</button>
      <button class="btn btn-secondary mb-3">Clear</button>
    </div>
  </div>
</div>

<script>
  function toggleSidebar() {
    var sidebar = document.getElementById("sidebar");
    if (sidebar.classList.contains('show-sidebar')) {
      sidebar.classList.remove('show-sidebar');
    } else {
      sidebar.classList.add('show-sidebar');
    }
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
